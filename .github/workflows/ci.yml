name: Test and build
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: ubuntu-24.04
            label: linux-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e ".[gui,build,test]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build.py
      - name: Smoke-test bundled CLI
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/auto-resume-agent/auto-resume-agent.exe --version
          else
            dist/auto-resume-agent/auto-resume-agent --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --prerelease --title "Auto Resume Agent $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
